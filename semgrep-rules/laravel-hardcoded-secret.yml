rules:
  - id: laravel-hardcoded-secret
    languages: [php]
    severity: ERROR
    message: >-
      "$NAME" parece guardar um segredo escrito direto no código. Qualquer um
      com acesso ao repositório vê a chave. Use env('...') / config('...') e o .env.
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 - Identification and Authentication Failures"
    patterns:
      - pattern-either:
          - pattern: const $NAME = $VAL;
          - pattern: $NAME = $VAL;
          - pattern: "[..., $NAME => $VAL, ...]"
      # acha pelo NOME, não pelo formato da chave (formato muda de provedor pra provedor)
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i).*(key|secret|token|passw|senha|credential).*
      # só string literal de 8+ caracteres sem espaço (ignora env(), números e textos)
      - metavariable-regex:
          metavariable: $VAL
          regex: ^['"][^\s'"]{8,}['"]$
      # aponta o achado pro valor (senão, em array, aponta pra linha do "[")
      - focus-metavariable: $VAL
