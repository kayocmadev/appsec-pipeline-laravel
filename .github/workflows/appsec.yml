name: AppSec

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Testes de regressão (PHPUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_sqlite
          coverage: none

      - name: Instalar dependências
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate

      # tests/Feature/SegurancaTest.php repete cada ataque (SQLi, XSS, mass assignment, headers)
      - name: php artisan test
        run: php artisan test

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # enviar o SARIF pra aba Security
    steps:
      - uses: actions/checkout@v7

      - name: Testar regras próprias
        run: docker run --rm -v "$PWD":/src -w /src semgrep/semgrep semgrep --test semgrep-rules/

      - name: Semgrep scan
        run: |
          docker run --rm -v "$PWD":/src -w /src semgrep/semgrep semgrep scan \
            --config p/php --config p/secrets --config r/php.laravel \
            --config semgrep-rules/ --metrics=off \
            --sarif-output=semgrep.sarif --error

      - name: Enviar resultado pra aba Security
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  sca:
    name: SCA (composer audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      # --locked lê só o composer.lock, sem instalar dependências
      - name: composer audit
        run: composer audit --locked

  dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_sqlite
          coverage: none

      - name: Instalar e preparar a app
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --seed --force

      # a app só existe dentro deste runner; o ZAP ataca localhost, nada externo
      - name: Subir a app
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > serve.log 2>&1 &
          for _ in $(seq 1 30); do
            curl -fs http://127.0.0.1:8000/produtos > /dev/null && exit 0
            sleep 1
          done
          cat serve.log
          exit 1

      - name: ZAP full scan
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          target: http://127.0.0.1:8000/produtos
          rules_file_name: .zap/rules.tsv # triagem: exceções justificadas
          allow_issue_writing: false # não abrir issue automática no repo
          fail_action: true
          artifact_name: zap-report
